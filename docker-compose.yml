name: aml-guard

# Profiles:  (default) core stack | llm = Ollama | tools = Redpanda Console | obs = observability | cadvisor
#   docker compose up -d                       -> core
#   docker compose --profile llm up -d         -> core + Ollama
#   docker compose --profile llm --profile tools up -d

x-obs-env: &obs-env
  OTEL_ENABLED: ${OTEL_ENABLED:-false}      # `make up-obs` turns tracing on; Prometheus metrics are always on
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1.0}

services:
  # ------------------------------ Graph ------------------------------
  neo4j:
    image: neo4j:5.26-community
    container_name: aml-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-aml_password_123}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-aml_password_123} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  neo4j-init:
    image: neo4j:5.26-community
    container_name: aml-neo4j-init
    restart: "no"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./graph:/graph:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - cypher-shell -a bolt://neo4j:7687 -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-aml_password_123} -f /graph/01_schema.cypher

  # ----------------------------- Streaming ---------------------------
  redpanda:
    image: redpandadata/redpanda:v24.3.7
    container_name: aml-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"  # Kafka API for host tools
      - "9644:9644"    # Admin API / metrics
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  redpanda-init:
    image: redpandadata/redpanda:v24.3.7
    container_name: aml-redpanda-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in transactions.raw transactions.truth transactions.decisions transactions.dlq alerts alerts.network; do
          rpk -X brokers=redpanda:9092 topic create $$t -p 3 -r 1 || true
        done

  redpanda-console:
    image: redpandadata/console:v2.8.2
    container_name: aml-redpanda-console
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # --------------------------- Cache + case store --------------------
  redis:
    image: redis:7.4-alpine
    container_name: aml-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: aml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aml_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-aml}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aml} -d ${POSTGRES_DB:-aml}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------- LLM -------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: aml-ollama
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU (NVIDIA): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: aml-ollama-pull
    profiles: ["llm"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull ${OLLAMA_PULL_MODEL:-llama3.1:8b}

  # ----------------------------- App services ------------------------
  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    container_name: aml-simulator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *obs-env
      SERVICE_NAME: simulator
    expose:
      - "8002"   # Prometheus /metrics
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      neo4j-init:
        condition: service_completed_successfully

  stream-processor:
    build:
      context: .
      dockerfile: services/stream_processor/Dockerfile
    container_name: aml-stream-processor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *obs-env
      SERVICE_NAME: stream-processor
    expose:
      - "8001"   # Prometheus /metrics
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      neo4j-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  graph-analytics:
    build:
      context: .
      dockerfile: services/graph_analytics/Dockerfile
    container_name: aml-graph-analytics
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *obs-env
      SERVICE_NAME: graph-analytics
    expose:
      - "8003"   # Prometheus /metrics
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      neo4j-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # ============================ Observability (profile: obs) ============================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    container_name: aml-otel-collector
    profiles: ["obs"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (apps; also usable from the host)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.8.2
    container_name: aml-tempo
    profiles: ["obs"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.5.3
    container_name: aml-loki
    profiles: ["obs"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: aml-alloy
    profiles: ["obs"]
    restart: unless-stopped
    user: root   # needs read access to the Docker socket to tail container logs
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data",
              "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "12345:12345"   # Alloy UI
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aml-prometheus
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: aml-redis-exporter
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: aml-postgres-exporter
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-aml}:${POSTGRES_PASSWORD:-aml_password_123}@postgres:5432/${POSTGRES_DB:-aml}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    container_name: aml-grafana
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aml-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  langfuse-db:
    image: postgres:16-alpine
    container_name: aml-langfuse-db
    profiles: ["obs"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Langfuse v2 (single container + Postgres). Used by the Phase 4 agents for LLM / LangGraph traces.
  langfuse:
    image: langfuse/langfuse:2
    container_name: aml-langfuse
    profiles: ["obs"]
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-aml-guard-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-aml-guard-dev-salt-change-me}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: aml-guard
      LANGFUSE_INIT_ORG_NAME: AML-Guard
      LANGFUSE_INIT_PROJECT_ID: aml-guard
      LANGFUSE_INIT_PROJECT_NAME: AML-Guard
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-aml-guard}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-aml-guard}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@aml-guard.local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:-aml-guard-admin}
    ports:
      - "3001:3000"

  # Container CPU / memory (Linux hosts only): docker compose --profile obs --profile cadvisor up -d
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: aml-cadvisor
    profiles: ["cadvisor"]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  neo4j_data:
  neo4j_logs:
  redpanda_data:
  pg_data:
  ollama_data:
  tempo_data:
  loki_data:
  alloy_data:
  prom_data:
  grafana_data:
  langfuse_db:
