apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace
          datasourceUid: tempo
          matcherRegex: '"trace_id":\s*"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace in Tempo
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        customQuery: true
        query: '{service=~".+"} | json | trace_id="$${__trace.traceId}"'
      nodeGraph:
        enabled: true
