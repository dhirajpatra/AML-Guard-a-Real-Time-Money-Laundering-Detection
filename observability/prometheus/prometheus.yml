global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: stream-processor
    static_configs: [{targets: ["stream-processor:8001"]}]
  - job_name: simulator
    static_configs: [{targets: ["simulator:8002"]}]
  - job_name: graph-analytics
    static_configs: [{targets: ["graph-analytics:8003"]}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["redpanda:9644"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
  - job_name: cadvisor            # only present with `--profile cadvisor` (Linux hosts)
    static_configs: [{targets: ["cadvisor:8080"]}]
