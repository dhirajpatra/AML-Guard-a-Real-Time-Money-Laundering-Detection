groups:
  - name: aml-guard
    rules:
      - alert: HotPathLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(aml_hotpath_seconds_bucket[5m]))) > 0.2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Hot-path p99 above 200 ms for 5 minutes"}
      - alert: ConsumerLagGrowing
        expr: sum(aml_consumer_lag) > 1000
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "stream-processor is more than 1000 messages behind"}
      - alert: DeadLetterMessages
        expr: increase(aml_dlq_total[10m]) > 0
        labels: {severity: warning}
        annotations: {summary: "Unparseable transactions are landing in transactions.dlq"}
      - alert: ProcessorDown
        expr: up{job="stream-processor"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "stream-processor metrics endpoint is down"}
      - alert: NoTransactionsScored
        expr: sum(rate(aml_txn_processed_total[5m])) == 0
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "No transactions scored for 10 minutes"}
      - alert: HighFlagRate
        expr: sum(rate(aml_txn_processed_total{verdict!="PASS"}[10m])) / sum(rate(aml_txn_processed_total[10m])) > 0.2
        for: 10m
        labels: {severity: info}
        annotations: {summary: "More than 20% of transactions are being flagged"}
      - alert: PostgresWriteErrors
        expr: increase(aml_pg_errors_total[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: "Case-store writes are failing"}
      - alert: AnalyticsStale
        expr: time() - aml_analytics_last_success_timestamp_seconds > 300
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Graph analytics has not completed a cycle for 5 minutes"}
      - alert: AnalyticsGdsFallback
        expr: increase(aml_analytics_gds_fallbacks_total[15m]) > 0
        labels: {severity: info}
        annotations: {summary: "Neo4j GDS failed; analytics fell back to networkx"}
